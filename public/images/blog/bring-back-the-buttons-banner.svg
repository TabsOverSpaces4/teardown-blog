<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F6"/>
      <stop offset="100%" stop-color="#EFE9E3"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E16428" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E16428"/>
      <stop offset="100%" stop-color="#E16428" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="140" cy="150" r="85" fill="#EFE9E3" opacity="0.6"/>
  <circle cx="1060" cy="450" r="105" fill="#EFE9E3" opacity="0.6"/>
  <circle cx="960" cy="100" r="42" fill="#E16428" opacity="0.08"/>
  <circle cx="240" cy="500" r="60" fill="#E16428" opacity="0.08"/>
  <!-- Accent line -->
  <rect x="300" y="240" width="600" height="3" rx="1.5" fill="url(#accent-line)"/>
  <!-- Title -->
  <text x="600" y="310" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#2A2420" letter-spacing="-1">Bring Back the Buttons</text>
  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#C9B59C" letter-spacing="3" text-transform="uppercase">UNBOXD OPINION</text>
  <!-- Bottom accent line -->
  <rect x="300" y="400" width="600" height="3" rx="1.5" fill="url(#accent-line)"/>
  <!-- Accent dot -->
  <circle cx="600" cy="440" r="5" fill="#E16428"/>
</svg>
