  <!-- Title -->
  <text x="600" y="290" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#2A2420" letter-spacing="-1">Why I Still Cannot Take</text>
  <text x="600" y="348" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#2A2420" letter-spacing="-1">My Galaxy Watch Off</text>
