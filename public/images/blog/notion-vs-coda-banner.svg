<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F6"/>
      <stop offset="100%" stop-color="#EFE9E3"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E16428" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E16428"/>
      <stop offset="100%" stop-color="#E16428" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="180" cy="160" r="100" fill="#EFE9E3" opacity="0.6"/>
  <circle cx="1020" cy="440" r="110" fill="#EFE9E3" opacity="0.6"/>
  <circle cx="950" cy="80" r="35" fill="#E16428" opacity="0.08"/>
  <circle cx="250" cy="520" r="55" fill="#E16428" opacity="0.08"/>
  <!-- Accent line -->
  <rect x="350" y="240" width="500" height="3" rx="1.5" fill="url(#accent-line)"/>
  <!-- Title -->
  <text x="600" y="310" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#2A2420" letter-spacing="-1">Notion vs Coda</text>
  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#C9B59C" letter-spacing="3" text-transform="uppercase">UNBOXD COMPARISON</text>
  <!-- Bottom accent line -->
  <rect x="350" y="400" width="500" height="3" rx="1.5" fill="url(#accent-line)"/>
  <!-- VS badge -->
  <circle cx="600" cy="445" r="16" fill="#E16428"/>
  <text x="600" y="446" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="white" letter-spacing="0.5">VS</text>
</svg>
